# docker-compose.yml
# Open-Source Real-Time Streaming Analytics Platform
# All services share the internal Docker network "streaming-net".

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Kafka / Zookeeper
  # ─────────────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'list' | kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - streaming-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Flink (custom image with connector JARs — see Dockerfile.flink)
  # ─────────────────────────────────────────────────────────────────────────
  flink-jobmanager:
    build:
      context: ./docker/build/flink
    container_name: flink-jobmanager
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 512m
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallel.default: 1
    volumes:
      - ./flink-jobs:/opt/flink/jobs
    command: jobmanager
    networks:
      - streaming-net

  flink-taskmanager:
    build:
      context: ./docker/build/flink
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 512m
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallel.default: 1
    volumes:
      - ./flink-jobs:/opt/flink/jobs
    command: taskmanager
    networks:
      - streaming-net

  flink-sql-client:
    build:
      context: ./docker/build/flink
    container_name: flink-sql-client
    profiles: ["tools"]
    depends_on:
      - flink-jobmanager
    entrypoint: ["bin/sql-client.sh"]
    volumes:
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: taxuser
      POSTGRES_PASSWORD: taxpass
      POSTGRES_DB: taxdb
    volumes:
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxuser -d taxdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Redis (hot KPI cache)
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - streaming-net

  # One-shot bucket creation (depends on minio being healthy)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./docker/minio-init.sh:/init.sh
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Qdrant (vector store)
  # ─────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Marquez (data lineage)
  # ─────────────────────────────────────────────────────────────────────────
  marquez:
    image: marquezproject/marquez:0.47.0
    container_name: marquez
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      MARQUEZ_DB_URL: jdbc:postgresql://postgres:5432/marquez
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_PORT: 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/namespaces"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - streaming-net

  marquez-web:
    image: marquezproject/marquez-web:0.47.0
    container_name: marquez-web
    depends_on:
      - marquez
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # MLflow (model tracking — custom Python image built inline)
  # ─────────────────────────────────────────────────────────────────────────
  mlflow:
    build:
      context: ./docker/build/mlflow
    container_name: mlflow
    depends_on:
      - postgres
      - minio
    ports:
      - "5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --default-artifact-root s3://mlflow-artifacts
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Streamlit (dashboard — custom Python image built inline)
  # ─────────────────────────────────────────────────────────────────────────
  streamlit:
    build:
      context: ./docker/build/streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MARQUEZ_API_URL: ${MARQUEZ_API_URL}
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Kafka Topic Initialisation (one-shot, profile: setup)
  # Run once after Kafka is healthy: podman compose --profile setup up kafka-topic-init
  # ─────────────────────────────────────────────────────────────────────────
  kafka-topic-init:
    build:
      context: ./producers
    container_name: kafka-topic-init
    profiles: ["setup"]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "topic_init.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
    networks:
      - streaming-net

  # ─────────────────────────────────────────────────────────────────────────
  # Tax Domain Producers (profile: producers)
  # Start all: podman compose --profile producers up -d
  # ─────────────────────────────────────────────────────────────────────────
  producer-tax-applications:
    build:
      context: ./producers
    container_name: producer-tax-applications
    profiles: ["producers"]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "producer_tax_applications.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_RATE_PER_SECOND: ${PRODUCER_RATE_PER_SECOND}
    restart: unless-stopped
    networks:
      - streaming-net

  producer-taxpayer-profiles:
    build:
      context: ./producers
    container_name: producer-taxpayer-profiles
    profiles: ["producers"]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "producer_taxpayer_profiles.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_RATE_PER_SECOND: ${PRODUCER_RATE_PER_SECOND}
    restart: unless-stopped
    networks:
      - streaming-net

  producer-fraud-signals:
    build:
      context: ./producers
    container_name: producer-fraud-signals
    profiles: ["producers"]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "producer_fraud_signals.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_RATE_PER_SECOND: ${PRODUCER_RATE_PER_SECOND}
    restart: unless-stopped
    networks:
      - streaming-net

  producer-audit-events:
    build:
      context: ./producers
    container_name: producer-audit-events
    profiles: ["producers"]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "producer_audit_events.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_RATE_PER_SECOND: ${PRODUCER_RATE_PER_SECOND}
    restart: unless-stopped
    networks:
      - streaming-net

# ── Networks & Volumes ───────────────────────────────────────────────────────
networks:
  streaming-net:
    name: streaming-net
    driver: bridge

volumes:
  qdrant_storage:
