[server]
runOnSave = true
port = 8501
address = "0.0.0.0"

[logger]
# Suppress deprecation-only warnings so container logs stay clean
level = "error"

[theme]
primaryColor         = "#2563eb"
backgroundColor      = "#ffffff"
secondaryBackgroundColor = "#f0f6ff"
textColor            = "#1a3a5c"
font                 = "sans serif"

[browser]
gatherUsageStats = false
